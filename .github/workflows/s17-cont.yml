name: s17 B fresh replay continuation (w2..w9 from a base run's w0/w1)
on:
  workflow_dispatch:
    inputs:
      bases: {type: string, required: true, description: 'JSON [{"run":ID,"shards":[globs]}]: shards taken from earlier runs'}
      waves:
        type: string
        default: "w0:1-1:1 w1:2-2:16 w2:3-3:10 w3:4-4:12 w4:5-5:4 w5:6-15:3 w6:16-16:6 w7:17-23:2 w8:24-24:8 w9:25-30:1"
      jobs: {type: string, default: "3"}
      pjobs: {type: string, default: "2"}
permissions:
  contents: read
  actions: read
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      w2: ${{ steps.m.outputs.w2 }}
      w3: ${{ steps.m.outputs.w3 }}
      w4: ${{ steps.m.outputs.w4 }}
      w5: ${{ steps.m.outputs.w5 }}
      w6: ${{ steps.m.outputs.w6 }}
      w7: ${{ steps.m.outputs.w7 }}
      w8: ${{ steps.m.outputs.w8 }}
      w9: ${{ steps.m.outputs.w9 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Plan, reuse custody (reused shards must equal the base runs' plans)
        id: m
        run: |
          set -euo pipefail
          mkdir -p plan reuse
          python3 replay/s17b.py plan --waves ${{ inputs.waves }} --complete --out plan/plan.json
          python3 replay/reuse.py prep --bases '${{ inputs.bases }}' --plan plan/plan.json --out reuse
          python3 replay/s17b.py matrix --plan plan/plan.json --waves w2 w3 w4 w5 w6 w7 w8 w9 --jobs ${{ inputs.jobs }} --pjobs ${{ inputs.pjobs }} | python3 -c "
          import sys,json
          skip=set(open('reuse/skip.txt').read().split())
          for l in sys.stdin:
              k,v=l.rstrip('\n').split('=',1)
              print(k+'='+json.dumps([x for x in json.loads(v) if x['shard'] not in skip],separators=(',',':')))" >> "$GITHUB_OUTPUT"
          sha256sum reuse/*.* plan/plan.json
      - uses: actions/upload-artifact@v4
        with: {name: plan, path: plan/, retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: reuse, path: reuse/, retention-days: 90}
  w2:
    needs: prep
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w2, shards: "${{ needs.prep.outputs.w2 }}", reuse: true}
  w3:
    needs: [prep, w2]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.w2.result != 'failure' }}
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w3, shards: "${{ needs.prep.outputs.w3 }}", reuse: true}
  w4:
    needs: [prep, w3]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.w3.result != 'failure' }}
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w4, shards: "${{ needs.prep.outputs.w4 }}", reuse: true}
  w5:
    needs: [prep, w4]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.w4.result != 'failure' }}
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w5, shards: "${{ needs.prep.outputs.w5 }}", reuse: true}
  w6:
    needs: [prep, w5]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.w5.result != 'failure' }}
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w6, shards: "${{ needs.prep.outputs.w6 }}", reuse: true}
  w7:
    needs: [prep, w6]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.w6.result != 'failure' }}
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w7, shards: "${{ needs.prep.outputs.w7 }}", reuse: true}
  w8:
    needs: [prep, w7]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.w7.result != 'failure' }}
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w8, shards: "${{ needs.prep.outputs.w8 }}", reuse: true}
  w9:
    needs: [prep, w8]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.w8.result != 'failure' }}
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w9, shards: "${{ needs.prep.outputs.w9 }}", reuse: true}
