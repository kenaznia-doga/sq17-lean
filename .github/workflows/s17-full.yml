name: s17 B fresh replay (full closure + leanchecker)
on:
  workflow_dispatch:
    inputs:
      waves:
        type: string
        default: "w0:1-1:1 w1:2-2:16 w2:3-3:1 w3:4-4:12 w4:5-5:4 w5:6-15:1 w6:16-16:6 w7:17-23:1 w8:24-24:8 w9:25-30:1"
      jobs: {type: string, default: "4"}
      pjobs: {type: string, default: "2"}
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      MATHLIB: "1"
      S17_SHARD: w0-00
    outputs:
      w1: ${{ steps.m.outputs.w1 }}
      w2: ${{ steps.m.outputs.w2 }}
      w3: ${{ steps.m.outputs.w3 }}
      w4: ${{ steps.m.outputs.w4 }}
      w5: ${{ steps.m.outputs.w5 }}
      w6: ${{ steps.m.outputs.w6 }}
      w7: ${{ steps.m.outputs.w7 }}
      w8: ${{ steps.m.outputs.w8 }}
      w9: ${{ steps.m.outputs.w9 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Setup
        run: bash replay/setup.sh
      - name: Plan
        id: m
        run: |
          mkdir -p plan out
          python3 replay/s17b.py plan --waves ${{ inputs.waves }} --complete --out plan/plan.json
          python3 replay/s17b.py matrix --plan plan/plan.json --waves w1 w2 w3 w4 w5 w6 w7 w8 w9 --jobs ${{ inputs.jobs }} --pjobs ${{ inputs.pjobs }} >> "$GITHUB_OUTPUT"
          python3 -c "import json;p=json.load(open('plan/plan.json'));open('shard.txt','w').write('\n'.join(p['w0'][0]['modules'])+'\n')"
      - name: Authenticate release; extract w0
        run: python3 replay/s17b.py extract --modules shard.txt --delete-archives
      - name: Native checker libraries + depth-1 modules
        run: |
          python3 replay/s17b.py fast --receipts out/receipts.jsonl --logs out/logs
          python3 replay/s17b.py build --modules shard.txt --jobs 4 --proof-jobs 4 --receipts out/receipts.jsonl --logs out/logs
          printf 'Sq17Lean.%s\n' HalfPlaneFast CaptureRunFast CaptureTableFast HalfPlaneCoverFast CaptureSummaryFast >> check0.txt
          cat shard.txt >> check0.txt
          python3 replay/s17b.py check --modules check0.txt --mathlib --batch 40 --receipts out/check.jsonl --logs out/checklogs
          python3 replay/s17b.py stage --fast --modules shard.txt --dest stage
          tar -czf out/logs.tgz out/logs out/checklogs; rm -rf out/logs out/checklogs
      - uses: actions/upload-artifact@v4
        with: {name: plan, path: plan/, retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: olean-w0-00, path: stage/, retention-days: 30, compression-level: 1}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: receipts-w0-00, path: out/, retention-days: 30}
  w1:
    needs: prep
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w1, shards: "${{ needs.prep.outputs.w1 }}"}
  w2:
    needs: [prep, w1]
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w2, shards: "${{ needs.prep.outputs.w2 }}"}
  w3:
    needs: [prep, w2]
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w3, shards: "${{ needs.prep.outputs.w3 }}"}
  w4:
    needs: [prep, w3]
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w4, shards: "${{ needs.prep.outputs.w4 }}"}
  w5:
    needs: [prep, w4]
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w5, shards: "${{ needs.prep.outputs.w5 }}"}
  w6:
    needs: [prep, w5]
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w6, shards: "${{ needs.prep.outputs.w6 }}"}
  w7:
    needs: [prep, w6]
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w7, shards: "${{ needs.prep.outputs.w7 }}"}
  w8:
    needs: [prep, w7]
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w8, shards: "${{ needs.prep.outputs.w8 }}"}
  w9:
    needs: [prep, w8]
    uses: ./.github/workflows/s17-wave.yml
    with: {wave: w9, shards: "${{ needs.prep.outputs.w9 }}"}
  mathlib:
    needs: prep
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      GH_TOKEN: ${{ github.token }}
      MATHLIB: "1"
      S17_SHARD: mathlib-${{ matrix.k }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Setup
        run: bash replay/setup.sh
      - name: leanchecker over the external import closure (all non-Lean/Lake modules), shard ${{ matrix.k }} of 8
        run: |
          set -euo pipefail
          mkdir -p out
          python3 -c "import json;print('\n'.join(json.load(open('manifest.json'))['external_imports']))" > ext.txt
          lake env lean --run replay/ExtClosure.lean ext.txt > closure.txt
          wc -l closure.txt
          grep -vE '^(Lean|Lake)(\.|$)' closure.txt | awk 'NR % 8 == ${{ matrix.k }}' > mine.txt
          wc -l mine.txt
          ( cd .lake/packages && find . -name '*.olean' -print0 | sort -z | xargs -0 sha256sum ) > out/package-oleans.sha256
          sha256sum closure.txt mine.txt > out/lists.sha256; cp closure.txt mine.txt out/
          n=0; : > out/mathlib-check.log
          while read -r batch; do
            /usr/bin/time -f "%e %M" -o t.txt lake env leanchecker $batch >> out/mathlib-check.log 2>&1 || { echo "FAIL $batch" | tee -a out/mathlib-check.log; exit 1; }
            n=$((n+$(echo $batch | wc -w))); echo "OK $n $(cat t.txt) $batch" >> out/mathlib-progress.log
          done < <(xargs -n 8 < mine.txt)
          echo "MATHLIB_LEANCHECKER_OK $n modules" | tee -a out/mathlib-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathlib-check-${{ matrix.k }}
          path: out/
          retention-days: 30
  final:
    needs: [w9, mathlib]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      MATHLIB: "1"
      S17_SHARD: final
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Setup
        run: bash replay/setup.sh
      - uses: actions/download-artifact@v4
        with: {pattern: olean-*, merge-multiple: true, path: .lake/build/lib/lean}
      - uses: actions/download-artifact@v4
        with: {pattern: receipts-*, path: receipts}
      - name: Validate the fresh-build chain
        run: |
          mkdir -p final
          python3 replay/check17.py --manifest manifest.json --receipts receipts --run "$GITHUB_RUN_ID" --lib .lake/build/lib/lean --out final/chain.json
      - name: Final statement and axiom audit (from this run's oleans)
        run: |
          set -euo pipefail
          LEAN_PATH=$PWD/.lake/build/lib/lean:$(lake env printenv LEAN_PATH) /usr/bin/time -v -o final/FinalAudit.time lean replay/FinalAudit.lean > final/FinalAudit.log 2>&1 && rc=0 || rc=$?
          echo "rc=$rc" >> final/FinalAudit.time
          tail -40 final/FinalAudit.log; grep -E 'Maximum resident|Elapsed' final/FinalAudit.time
          test "$rc" -eq 0
          ! grep -qE 'error:|sorryAx' final/FinalAudit.log
          python3 replay/compare_axioms.py final/FinalAudit.log --reference verification/Square17Optimality.log --out final/axioms.json
      - name: Square17Optimality's own build log vs the producer's
        run: |
          set -euo pipefail
          mkdir -p w9logs && for t in receipts/receipts-w9-*/logs.tgz; do tar -xzf "$t" -C w9logs; done
          cp w9logs/out/logs/Sq17Lean.Square17Optimality.log final/Square17Optimality.build.log
          python3 replay/compare_axioms.py final/Square17Optimality.build.log --reference verification/Square17Optimality.log --out final/axioms-buildlog.json
      - name: Trust-base inventory (toolchain, Mathlib cache oleans, sources)
        if: always()
        run: |
          lean --version > final/toolchain.txt; sha256sum $(dirname $(elan which lean))/* >> final/toolchain.txt 2>/dev/null || true
          ( cd .lake/packages && find . -name '*.olean' -print0 | sort -z | xargs -0 sha256sum ) > final/package-oleans.sha256
          wc -l final/package-oleans.sha256
          python3 -c "
          import json,hashlib
          m=json.load(open('manifest.json'))
          lines=sorted(f\"{k} {v['sha256']}\" for k,v in m['sources'].items())
          open('final/source_list.txt','w').write('\n'.join(lines)+'\n')
          "
          sha256sum manifest.json lean-toolchain lake-manifest.json lakefile.toml replay/* > final/config.sha256
          sha256sum final/* > final/SHA256SUMS || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: final-evidence, path: final/, retention-days: 90}
